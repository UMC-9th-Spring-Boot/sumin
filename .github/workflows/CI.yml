name: Spring Boot CI with gradle

on:
  push:
    branches: [ "main", "develop", "feat/**", "feature/**" ]
    paths:
      - "build.gradle*"
      - "settings.gradle*"
      - "gradlew"
      - "gradle/**"
      - "src/**"
      - ".github/workflows/**"
  pull_request:
    branches: [ "main", "develop" ]
    paths:
      - "build.gradle*"
      - "settings.gradle*"
      - "gradlew"
      - "gradle/**"
      - "src/**"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      # 1) 체크아웃
      - name: Checkout
        uses: actions/checkout@v4

      # 2) JDK 17
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # 3) GitHub Secret으로 application.yml 생성
      - name: Make application.yml from secret
        shell: bash
        run: |
          mkdir -p ./src/main/resources
          cat > ./src/main/resources/application.yml <<'EOF'
          ${{ secrets.APPLICATION_YML }}
          EOF
          sed -i 's/\r$//' ./src/main/resources/application.yml

      # 4) gradlew 실행 권한
      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      # 5) 빌드(테스트 포함)
      - name: Build with Gradle
        run: ./gradlew clean build

      # 6) 테스트 리포트 업로드
      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-reports
          path: |
            **/build/test-results/test
            **/build/reports/tests/test

      # 7) 실패 요약
      - name: Print failed tests (if any)
        if: failure()
        shell: bash
        run: |
          echo "---- Failed Test Classes (if any) ----"
          if ls **/build/test-results/test/*.xml >/dev/null 2>&1; then
            grep -Hn "failure message=" -R **/build/test-results/test/*.xml || true
          else
            echo "No test result XML files found."
          fi
