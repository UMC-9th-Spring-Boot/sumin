name: Spring Boot CI with gradle

on:
  push:
    branches: [ "main", "develop", "feat/**", "feature/**" ]
    paths:
      - "build.gradle*"
      - "settings.gradle*"
      - "gradlew"
      - "gradle/**"
      - "src/**"
      - ".github/workflows/**"
  pull_request:
    branches: [ "main", "develop" ]
    paths:
      - "build.gradle*"
      - "settings.gradle*"
      - "gradlew"
      - "gradle/**"
      - "src/**"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          
      - name: Make application.yml from secret
        if: ${{ secrets.APPLICATION_YML != '' }}
        shell: bash
        run: |
          mkdir -p ./src/main/resources
          cat > ./src/main/resources/application.yml <<'EOF'
          ${{ secrets.APPLICATION_YML }}
          EOF
          sed -i 's/\r$//' ./src/main/resources/application.yml
          
      - name: Make test application.yml 
        shell: bash
        run: |
          mkdir -p ./src/test/resources
          cat > ./src/test/resources/application.yml <<'EOF'
          spring:
            datasource:
              driver-class-name: org.h2.Driver
              url: jdbc:h2:mem:testdb;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
              username: sa
              password:
            jpa:
              database-platform: org.hibernate.dialect.H2Dialect
              hibernate:
                ddl-auto: create-drop
              show-sql: false
          EOF

      - name: Build with Gradle (test profile)
        uses: gradle/gradle-build-action@v3
        env:
          SPRING_PROFILES_ACTIVE: test
        with:
          arguments: clean build --no-daemon

      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-reports
          path: |
            **/build/test-results/test
            **/build/reports/tests/test

      - name: Print failed tests (if any)
        if: failure()
        shell: bash
        run: |
          echo "---- Failed Test Classes (if any) ----"
          if ls **/build/test-results/test/*.xml >/dev/null 2>&1; then
            grep -Hn "failure message=" -R **/build/test-results/test/*.xml || true
          else
            echo "No test result XML files found."
          fi
